url: https://mjfrigaard.github.io/perfinr/

template:
  bootstrap: 5
  light-switch: true
  theme: arrow-light
  theme-dark: arrow-dark
  bslib:
    bg: "#FBF6E9"          # cream tint: page background (light)
    fg: "#3E2A1E"          # chocolate brown: body text (light)
    primary: "#2A6F77"     # teal: links, buttons, navbar
    secondary: "#1B2A41"   # midnight navy: neutral emphasis
    success: "#5B8C5A"     # avocado green
    info: "#2A6F77"        # teal
    warning: "#E8A33D"     # harvest gold
    danger: "#B83A4B"      # brick red
    base_font:
      google: Ubuntu
    heading_font:
      google: Fira Sans Condensed
    code_font:
      google: Ubuntu Mono

articles:
- title: Foundations
  navbar: Foundations
  contents:
  - income
  - tracking-spending
  - budgeting
  - managing-debt
  - emergency-fund

